<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — H/77</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <a class="logo" href="index.html">H/77</a>
    <button class="menu-btn" type="button">☰</button>

    <nav class="nav">
      <a href="index.html">HOME</a>
      <a href="shop.html">SHOP</a>
      <a href="about.html">ABOUT</a>
      <a href="contact.html">CONTACT</a>
      <a href="cart.html">CART <span id="cartCount">0</span></a>
    </nav>
  </header>

  <main class="page">
    <div class="page-title">
      <p class="eyebrow">YOUR SELECTION</p>
      <h1>CART</h1>
    </div>

    <div id="cartItems"></div>

    <section id="checkoutSection" class="checkout-section">
      <div class="page-title">
        <p class="eyebrow">DELIVERY DETAILS</p>
        <h2>COMPLETE YOUR ORDER</h2>
      </div>

      <form id="checkoutForm">
        <div class="form-group">
          <label for="customerName">Full Name</label>
          <input
            type="text"
            id="customerName"
            name="customer_name"
            placeholder="Enter your full name"
            minlength="2"
            maxlength="100"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="customerPhone">Mobile Number</label>
          <input
            type="tel"
            id="customerPhone"
            name="phone"
            placeholder="Enter your mobile number"
            minlength="7"
            maxlength="20"
            autocomplete="tel"
            inputmode="tel"
            required
          >
        </div>

        <div class="form-group">
          <label for="customerAddress">Delivery Address</label>
          <textarea
            id="customerAddress"
            name="address"
            placeholder="Governorate, area, street, building and apartment"
            minlength="5"
            maxlength="500"
            autocomplete="street-address"
            rows="4"
            required
          ></textarea>
        </div>

        <button type="submit" id="checkoutButton" class="btn">
          CONFIRM ORDER
        </button>

        <p id="checkoutMessage" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>
    <span>© 2026 H/77</span>
    <span>DROP 01</span>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
